name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-health:
    name: 文档与仓库卫生（R-GOV 基础）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: check-repo-health
        run: node scripts/check-repo-health.mjs

  secret-scan:
    name: 密钥扫描（gitleaks）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 自动检测 Maven/Gradle 并构建（backend/ 就位前跳过）
        run: |
          if [ ! -d backend ]; then echo "跳过：backend/ 不存在"; exit 0; fi
          if [ -n "$(find backend -name pom.xml -print -quit)" ]; then
            mvn -B -ntp -f backend verify
          elif [ -n "$(find backend -name 'build.gradle*' -print -quit)" ]; then
            chmod +x backend/gradlew 2>/dev/null || true
            (cd backend && ./gradlew build --no-daemon)
          else
            echo "backend/ 存在但未找到构建文件"
            exit 1
          fi
      # P01 确定构建工具与模块布局后：接入 setup-java 缓存与 Checkstyle/ArchUnit 报告上传

  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # P01 lockfile 就位后为 setup-node 增加 npm 缓存（cache-dependency-path: frontend/package-lock.json）
      - name: lint / type-check / test / build（frontend/ 就位前跳过）
        run: |
          if [ ! -f frontend/package.json ]; then echo "跳过：frontend/package.json 不存在"; exit 0; fi
          cd frontend
          npm ci
          npm run lint --if-present
          npm run type-check --if-present
          npm test --if-present
          npm run build --if-present

  docker-build:
    name: Docker 镜像构建（不推送）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: 构建全部 Dockerfile（Dockerfile 就位前跳过）
        run: |
          found=0
          for f in $(find . -name Dockerfile -not -path './.git/*'); do
            ctx=$(dirname "$f")
            echo "构建 $f（context: $ctx）"
            docker build -t "flexforge-ci:$(basename "$ctx")" "$ctx"
            found=1
          done
          if [ "$found" -eq 0 ]; then echo "跳过：未发现 Dockerfile"; fi

  dependency-audit:
    name: 依赖漏洞审计（npm，high+）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: npm audit（lockfile 就位前跳过）
        run: |
          if [ ! -f frontend/package-lock.json ]; then echo "跳过：frontend/package-lock.json 不存在"; exit 0; fi
          cd frontend
          npm audit --omit=dev --audit-level=high
