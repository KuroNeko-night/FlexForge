name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-health:
    name: 仓库健康检查（R-GOV + 全量门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # check-repo-health 内部会 npm ci + mvnw verify（含 Testcontainers），runner 自带 Docker
      - name: check-repo-health
        run: node scripts/check-repo-health.mjs

  secret-scan:
    name: 密钥扫描（gitleaks）
    permissions:
      contents: read
      pull-requests: read # PR 事件下 gitleaks 需要读取 PR commits 做 diff 扫描
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 构建与测试（Maven Wrapper，backend/ 就位前跳过）
        run: |
          if [ ! -d backend ]; then echo "跳过：backend/ 不存在"; exit 0; fi
          cd backend
          chmod +x mvnw
          ./mvnw -B -ntp verify

  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: lint / type-check / test / build（frontend/ 就位前跳过）
        run: |
          if [ ! -f frontend/package.json ]; then echo "跳过：frontend/package.json 不存在"; exit 0; fi
          cd frontend
          npm ci
          npm run lint --if-present
          npm run type-check --if-present
          npm test --if-present
          npm run build --if-present

  docker-build:
    name: Docker 镜像构建（不推送）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: 构建全部 Dockerfile（Dockerfile 就位前跳过）
        run: |
          found=0
          # 统一约定：Dockerfile 的 build context 一律为仓库根（backend/Dockerfile 需要访问 database/）
          for f in $(find . -name Dockerfile -not -path './.git/*'); do
            echo "构建 $f（context: .）"
            docker build -f "$f" -t "flexforge-ci:$(dirname "$f" | sed 's|^\./||; s|/|-|g; s|^\.|root|')" .
            found=1
          done
          if [ "$found" -eq 0 ]; then echo "跳过：未发现 Dockerfile"; fi

  dependency-audit:
    name: 依赖漏洞审计（npm，high+）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: npm audit（lockfile 就位前跳过）
        run: |
          if [ ! -f frontend/package-lock.json ]; then echo "跳过：frontend/package-lock.json 不存在"; exit 0; fi
          cd frontend
          npm audit --omit=dev --audit-level=high
