# Dependabot 版本更新：github-actions 生态现在即生效；
# 其余生态在 P01 对应文件就位后解开注释（docs/13 §3.9 依赖供应链基线）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

