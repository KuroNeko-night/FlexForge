# FlexForge 开发环境编排（P01：db + backend + frontend）
# 端口只绑定 127.0.0.1，避免向局域网暴露开发环境（docs/13 §3.8）
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: flexforge-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flexforge-pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flexforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/flexforge
      DB_USERNAME: flexforge
      DB_PASSWORD: flexforge
      # S4：JWT 密钥与引导管理员密码仅经 .env 注入；AUTH_JWT_SECRET 为空时后端启动失败（fail-fast）
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?请在 .env 设置 AUTH_JWT_SECRET（openssl rand -base64 48）}
      AUTH_JWT_TTL: ${AUTH_JWT_TTL:-PT8H}
      FLEXFORGE_BOOTSTRAP_ADMIN_PASSWORD: ${FLEXFORGE_BOOTSTRAP_ADMIN_PASSWORD:-}
      # P11：模型端口选择与在线凭据（fixture 默认；密钥仅环境变量，docs/13 §3.6）
      FLEXFORGE_AI_PROVIDER: ${FLEXFORGE_AI_PROVIDER:-fixture}
      FLEXFORGE_AI_BASE_URL: ${FLEXFORGE_AI_BASE_URL:-}
    ports:
      # 宿主端口默认 8088，避免与本机其他 8080 服务冲突；可用 .env 的 BACKEND_PORT 覆盖
      - "127.0.0.1:${BACKEND_PORT:-8088}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # 容器内同源代理直接指向 backend 服务；宿主侧访问 http://127.0.0.1:5173
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ | grep -q '<div id=\"app\">'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  flexforge-pgdata:
