  </defs>
  <rect width="480" height="480" fill="url(#wash)"/>
  <rect width="480" height="480" fill="url(#grid)"/>
  <g fill="none" stroke="#2b5fd9" stroke-opacity="0.16" stroke-width="2">
    <rect x="56" y="72" width="88" height="88" rx="12"/>
    <rect x="336" y="120" width="64" height="64" rx="10"/>
    <rect x="152" y="312" width="112" height="64" rx="12"/>
    <rect x="360" y="336" width="56" height="56" rx="10"/>
  </g>
  <g fill="#2b5fd9" fill-opacity="0.10">
